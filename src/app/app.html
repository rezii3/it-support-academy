<div class="app-shell">
  <!-- Top Header -->
  <app-navbar (toggleSidebar)="toggleSidebar()" />

  <div class="app-body">
    <!-- Mobile Backdrop -->
    @if (isSidebarOpen()) {
      <div class="sidebar-backdrop" (click)="closeSidebarOnMobile()"></div>
    }

    <!-- Left Sidebar with Modules List -->
    <aside class="sidebar" [class.open]="isSidebarOpen()">
      <nav class="sidebar-nav">
        <div class="nav-group">
          <span class="nav-group-title">ნავიგაცია (Navigation)</span>
          <a
            routerLink="/dashboard"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-item"
            (click)="closeSidebarOnMobile()"
          >
            <span class="nav-icon">📊</span>
            <span class="nav-label">მთავარი დაფა (Dashboard)</span>
          </a>
        </div>

        <div class="nav-group">
          <span class="nav-group-title">სასწავლო მოდულები (Modules)</span>

          @for (mod of curriculumService.modules(); track mod.id) {
            <a
              [routerLink]="['/modules', mod.id]"
              routerLinkActive="active-link"
              class="module-nav-item"
              (click)="closeSidebarOnMobile()"
            >
              <div class="module-nav-top">
                <span class="module-nav-icon">{{ mod.icon }}</span>
                <div class="module-nav-info">
                  <span class="module-nav-order">მოდული {{ mod.order }}</span>
                  <span class="module-nav-title">{{ mod.title }}</span>
                </div>
                <span
                  class="module-nav-pct"
                  [class.done]="getModuleProgress(mod.id) === 100"
                >
                  {{ getModuleProgress(mod.id) }}%
                </span>
              </div>

              <app-progress-bar
                [value]="getModuleProgress(mod.id)"
                [showPercentage]="false"
                size="sm"
              />
            </a>
          }
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="storage-status">
          <span class="status-dot"></span>
          <span>მონაცემები ინახება (Saved in localStorage)</span>
        </div>
      </div>
    </aside>

    <!-- Main Router Outlet Area -->
    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
